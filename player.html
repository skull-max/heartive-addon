<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skull Portal Engine</title>
    <style>
        body { background-color: #050508; color: #ffffff; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
        .app-container { width: 100vw; height: 100vh; display: flex; flex-direction: column; background-color: #000000; position: relative; }
        .top-bar { background-color: #0d0e15; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #45f3ff; z-index: 10; }
        .title { font-size: 16px; font-weight: bold; color: #45f3ff; letter-spacing: 2px; text-shadow: 0 0 10px #45f3ff; }
        .stream-window { flex-grow: 1; position: relative; background-color: #000; }
        iframe { width: 100%; height: 100%; border: none; z-index: 1; }
        .click-shield { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 5; cursor: pointer; background: transparent; display: block; }
        .loading-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: #050508; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 4; }
        .spinner { width: 50px; height: 50px; border: 5px solid #13141f; border-top: 5px solid #45f3ff; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .loading-text { margin-top: 15px; color: #45f3ff; font-size: 14px; letter-spacing: 2px; font-weight: bold; }
        .skull-watermark { position: absolute; bottom: 15px; left: 15px; font-size: 24px; color: rgba(255, 255, 255, 0.15); font-weight: bold; z-index: 8; pointer-events: none; user-select: none; display: none; }
    </style>
</head>
<body>

    <div class="app-container">
        <div id="top-bar" class="top-bar">
            <span class="title">💀 SKULL FALLBACK LAYER</span>
            <span id="shield-status" style="font-size: 12px; color: #45f3ff; font-weight: bold;">Loading Server Portal...</span>
        </div>
        <div class="stream-window">
            <div id="portal-shield" class="click-shield"></div>
            
            <div id="spinner-layer" class="loading-overlay">
                <div class="spinner"></div>
                <div class="loading-text">PREPARING STREAM WINDOW...</div>
            </div>

            <div id="skull-logo" class="skull-watermark">💀</div>

            <!-- added explicit full screen allowance tags for android browsers -->
            <iframe id="app-video-frame" src="" allowfullscreen="true" webkitallowfullscreen="true" mozallowfullscreen="true" referrerpolicy="no-referrer"></iframe>
        </div>
    </div>

    <script>
        const shield = document.getElementById('portal-shield');
        const statusText = document.getElementById('shield-status');
        const spinner = document.getElementById('spinner-layer');
        const iframe = document.getElementById('app-video-frame');
        const topBar = document.getElementById('top-bar');
        const skullLogo = document.getElementById('skull-logo');

        const urlParams = new URLSearchParams(window.location.search);
        const imdbId = urlParams.get('id');
        const mediaType = urlParams.get('type') || 'movie';
        const targetServer = urlParams.get('server') || '2';
        const s = String.fromCharCode(47); 

        if (targetServer === '2') {
            statusText.innerText = "PORTAL 2: VIDLINK ACTIVE";
        } else {
            statusText.innerText = "PORTAL 3: MULTIEMBED ACTIVE";
        }

        shield.addEventListener('click', function() {
            shield.style.display = 'none';
            topBar.style.display = 'none'; 
            skullLogo.style.display = 'block';
            
            // Mobile Native Fullscreen Request Trigger
            const container = document.documentElement;
            if (container.requestFullscreen) { container.requestFullscreen(); }
            else if (container.webkitRequestFullscreen) { container.webkitRequestFullscreen(); }
        });

        iframe.onload = function() {
            spinner.style.display = 'none';
        };

        if (imdbId) {
            if (mediaType === 'movie') {
                if (targetServer === '2') {
                    iframe.src = "https:" + s + s + "vidlink.pro" + s + "embed" + s + "movie" + s + imdbId;
                } else {
                    iframe.src = "https:" + s + s + "multiembed.mov" + s + "?video_id=" + imdbId;
                }
            } else {
                const parts = imdbId.split(':');
                const showId = parts[0];
                const season = parts[1] || '1';
                const episode = parts[2] || '1';
                
                if (targetServer === '2') {
                    iframe.src = "https:" + s + s + "vidlink.pro" + s + "embed" + s + "tv" + s + showId + s + season + s + episode;
                } else {
                    iframe.src = "https:" + s + s + "multiembed.mov" + s + "?video_id=" + showId + "&s=" + season + "&e=" + episode;
                }
            }
        }
    </script>
</body>
</html>
